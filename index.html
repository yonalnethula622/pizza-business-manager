<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d62828">
<meta name="description" content="Ceylon Crust Pizza Business Manager">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="./logo.png">
<link rel="apple-touch-icon" href="./logo.png">
<title>Ceylon Crust Pizza | Business Manager</title>
<style>
:root{
  --red:#d62828;--red-dark:#b91f24;--orange:#f4a623;--yellow:#ffd166;
  --ink:#242124;--muted:#77727a;--paper:#fff;--bg:#fff7f1;
  --line:#f0e5df;--green:#238b57;--blue:#3978c6;--shadow:0 12px 35px rgba(75,35,20,.08);
  --radius:18px
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{min-height:100vh;display:flex}
.sidebar{width:258px;flex:0 0 258px;background:linear-gradient(180deg,#c91f2a 0%,#a81722 100%);color:#fff;padding:24px 16px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:10;box-shadow:8px 0 30px rgba(128,25,30,.12)}
.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 28px;border-bottom:1px solid rgba(255,255,255,.2)}
.brand-icon{width:58px;height:58px;flex:0 0 58px;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 6px 18px #76131c55}.brand-icon img{width:100%;height:100%;object-fit:contain}
.brand h1{font-size:15px;letter-spacing:1px;margin:0;font-weight:900}.brand small{display:block;font-size:10px;letter-spacing:2px;margin-top:5px;color:#ffe3d1;font-weight:700}
.menu-label{font-size:10px;font-weight:800;letter-spacing:1.7px;color:#ffd6c5;padding:26px 12px 10px}
.nav{display:grid;gap:7px}
.nav button{border:0;background:transparent;color:#ffe9e4;text-align:left;padding:12px 14px;border-radius:12px;font-weight:700;display:flex;align-items:center;gap:12px}
.nav button:hover,.nav button.active{background:#fff;color:var(--red);box-shadow:0 5px 16px #74131b33}
.nav .ico{width:22px;text-align:center;font-size:18px}
.sidebar-footer{margin-top:auto;padding:18px 12px 4px;color:#ffd6c5;font-size:11px;border-top:1px solid #ffffff33}
.main{margin-left:258px;width:calc(100% - 258px);min-height:100vh}
.topbar{height:76px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar h2{margin:0;font-size:19px}.topbar small{color:var(--muted)}
.content{padding:28px;max-width:1500px;margin:auto}
.welcome{background:linear-gradient(115deg,#d62828,#f05b2d 65%,#f4a623);border-radius:22px;padding:28px 30px;color:white;display:flex;justify-content:space-between;align-items:center;gap:20px;box-shadow:0 12px 28px #d628282c}
.welcome h2{font-size:25px;margin:0 0 8px}.welcome p{margin:0;color:#fff0e9}.welcome .welcome-mark{font-size:65px;filter:drop-shadow(0 7px 8px #7e1d1d55)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:17px;margin:22px 0}
.stat{background:#fff;border-radius:17px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--line);position:relative;overflow:hidden}
.stat:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-25px;top:-25px;opacity:.13;background:var(--accent)}
.stat .label{font-size:12px;color:var(--muted);font-weight:700}.stat strong{display:block;font-size:26px;margin:10px 0 4px}.stat small{color:var(--muted)}
.stat .stat-ico{position:absolute;right:17px;bottom:17px;font-size:27px}
.grid-two{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:var(--shadow);margin-bottom:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}
.card-head h3{margin:0;font-size:16px}.muted{color:var(--muted)}
.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:800;background:var(--red);color:#fff;box-shadow:0 5px 12px #d6282822}
.btn:hover{filter:brightness(.95);transform:translateY(-1px)}
.btn.orange{background:var(--orange);color:#38220b}.btn.green{background:var(--green)}.btn.blue{background:var(--blue)}.btn.light{background:#fff0e9;color:var(--red);box-shadow:none}.btn.gray{background:#eee;color:#444;box-shadow:none}.btn.danger{background:#b91f24}.btn.small{padding:7px 10px;font-size:12px;border-radius:8px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:650px}
th{text-align:left;background:#fff8f3;color:#88756e;font-size:11px;text-transform:uppercase;letter-spacing:.7px;padding:12px 11px}
td{padding:13px 11px;border-bottom:1px solid #f2ebe7;font-size:13px}
tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:5px 9px;border-radius:30px;font-size:10px;font-weight:900;background:#fff0d8;color:#9b6100}
.badge.paid{background:#e1f5e9;color:#187346}.badge.pending{background:#fff0d8;color:#9b6100}.badge.partial{background:#e7f0ff;color:#3268aa}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.field{display:grid;gap:6px}.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:800;color:#675c59}
.field input,.field select,.field textarea{width:100%;border:1px solid #e9ddd7;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px #f4a62322}
.invoice-line{display:grid;grid-template-columns:2fr .7fr .9fr .9fr auto;gap:9px;align-items:end;margin-bottom:10px}
.invoice-line input,.invoice-line select{width:100%;border:1px solid #e9ddd7;border-radius:9px;padding:10px;background:#fff}
.summary{margin-left:auto;max-width:350px;display:grid;gap:9px;padding:15px;background:#fff8f3;border-radius:13px}
.summary-row{display:flex;justify-content:space-between;font-size:13px}.summary-row.total{font-size:19px;font-weight:900;color:var(--red);border-top:1px solid #eadbd2;padding-top:10px}
.empty{text-align:center;padding:35px 15px;color:var(--muted)}
.search{border:1px solid #e9ddd7;border-radius:10px;padding:10px 12px;min-width:220px}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#a81722,#e84b2c 60%,#f4a623)}
.login-box{background:#fff;border-radius:24px;padding:35px;width:min(420px,100%);box-shadow:0 20px 60px #5b101b55;text-align:center}
.login-logo{width:110px;height:110px;object-fit:contain;border-radius:20px;margin-bottom:12px}
.login-box h1{margin:0;color:var(--red);font-size:25px}.login-box p{color:var(--muted);font-size:13px;margin:8px 0 25px}
.login-box input{width:100%;padding:13px;border:1px solid #e8dcd5;border-radius:10px;margin-bottom:12px}
.login-box button{width:100%;padding:13px}
.toast{position:fixed;right:22px;bottom:22px;background:#252225;color:white;padding:13px 18px;border-radius:12px;z-index:100;box-shadow:var(--shadow);font-size:13px}
.mobile-menu{display:none}
.print-area{display:none}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.grid-two{grid-template-columns:1fr}}
@media(max-width:720px){
 .sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:translateX(0)}
 .main{margin-left:0;width:100%}.mobile-menu{display:inline-block}
 .topbar{padding:0 15px}.content{padding:16px}.welcome{padding:22px}.welcome h2{font-size:20px}
 .stats{gap:10px}.stat{padding:15px}.stat strong{font-size:21px}
 .form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}
 .invoice-line{grid-template-columns:1fr 1fr}.invoice-line .line-product{grid-column:1/-1}
 .login-box{padding:25px}
}
@media print{
 body{background:white!important}
 body *{visibility:hidden!important}
 #printArea,#printArea *{visibility:visible!important}
 #printArea{display:block!important;position:absolute;left:0;top:0;width:100%;padding:12mm;font-family:Arial,sans-serif;color:#222}
 .no-print{display:none!important}
 @page{size:A4;margin:10mm}
}
</style>
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <img class="login-logo" src="logo.png" alt="Ceylon Crust Pizza Logo" onerror="this.style.display='none'">
    <h1>CEYLON CRUST</h1>
    <p>PIZZA BUSINESS MANAGER</p>
    <input id="loginEmail" type="email" placeholder="Email address" autocomplete="username">
    <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" onclick="login()">Login</button>
    <p style="margin:16px 0 0;font-size:11px">Staff access only</p>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon"><img src="logo.png" alt="Logo" onerror="this.style.display='none'"></div>
      <div><h1>CEYLON CRUST</h1><small>PIZZA BUSINESS</small></div>
    </div>
    <div class="menu-label">MAIN MENU</div>
    <nav class="nav">
      <button class="active" data-page="dashboard" onclick="navigateTo('dashboard')"><span class="ico">▦</span>Dashboard</button>
      <button data-page="create" onclick="navigateTo('create')"><span class="ico">＋</span>Create Invoice</button>
      <button data-page="invoices" onclick="navigateTo('invoices')"><span class="ico">▤</span>All Invoices</button>
      <button data-page="customers" onclick="navigateTo('customers')"><span class="ico">♙</span>Customers</button>
      <button data-page="menu" onclick="navigateTo('menu')"><span class="ico">🍕</span>Pizza & Pricing</button>
      <button data-page="reports" onclick="navigateTo('reports')"><span class="ico">▥</span>Sales Reports</button>
      <button data-page="settings" onclick="navigateTo('settings')"><span class="ico">⚙</span>Settings</button>
    </nav>
    <div class="sidebar-footer">CEYLON CRUST PIZZA<br>Business Manager</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn light mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <div><h2 id="pageTitle">Dashboard</h2><small id="todayLabel"></small></div>
      </div>
      <button class="btn light small" onclick="logout()">Log out</button>
    </header>
    <div class="content" id="pageContent"></div>
  </main>
</div>
<div id="toast" class="toast hidden"></div>
<div id="printArea" class="print-area"></div>

<script type="module">
import { auth, db } from "./firebase.js";
import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const CLOUD_DOC = doc(db, "appData", "main");
const money=n=>"AED "+Number(n||0).toFixed(2);
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
let invoices=[];
let menu=[
 {name:"Classic Margherita",price:25},
 {name:"Chicken Tikka",price:32},
 {name:"BBQ Chicken",price:34},
 {name:"Spicy Chicken",price:33},
 {name:"Chicken Sausage",price:32},
 {name:"Veggie Delight",price:29}
];
let settings={};
let currentPage="dashboard";
let invoiceRows=[];

async function saveAll(){
  try {
    await setDoc(CLOUD_DOC, {
      invoices,
      menu,
      settings,
      updatedAt: Date.now()
    });
    // Keep a local backup copy on this browser as a convenience.
    localStorage.setItem("CCP_LOCAL_BACKUP", JSON.stringify({invoices,menu,settings}));
  } catch (error) {
    console.error("Firestore save failed:", error);
    toast("Could not save to cloud. Check your connection and sign-in.");
  }
}
function toast(message){
 const el=document.getElementById("toast");el.textContent=message;el.classList.remove("hidden");
 clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add("hidden"),2800);
}
async function login(){
  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPassword").value;
  if(!email || !password) return toast("Enter your email and password");
  try {
    await signInWithEmailAndPassword(auth,email,password);
    // onAuthStateChanged will load cloud data and open the app.
  } catch(error) {
    console.error("Firebase login failed:",error);
    toast(error.code==="auth/invalid-credential" ? "Email or password is incorrect" : "Login failed: "+error.message);
  }
}
async function logout(){
  try {
    await signOut(auth);
  } catch(error) {
    console.error("Logout failed:",error);
    toast("Could not log out. Please try again.");
  }
  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
}
function showApp(){
 document.getElementById("loginScreen").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 document.getElementById("todayLabel").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
 navigateTo(currentPage);
}
function navigateTo(page){
 currentPage=page;
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 const titles={dashboard:"Dashboard",create:"Create Invoice",invoices:"All Invoices",customers:"Customers",menu:"Pizza & Pricing",reports:"Sales Reports",settings:"Settings"};
 document.getElementById("pageTitle").textContent=titles[page]||"Dashboard";
 document.getElementById("sidebar").classList.remove("open");
 const render={dashboard:renderDashboard,create:renderCreate,invoices:renderInvoices,customers:renderCustomers,menu:renderMenu,reports:renderReports,settings:renderSettings};
 (render[page]||renderDashboard)();
}
function setContent(html){document.getElementById("pageContent").innerHTML=html}
function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function renderDashboard(){
 const totalSales=invoices.reduce((s,x)=>s+Number(x.total||0),0);
 const paid=invoices.reduce((s,x)=>s+Number(x.paid||0),0);
 const due=invoices.reduce((s,x)=>s+Number(x.balance||0),0);
 const todayOrders=invoices.filter(x=>x.date===today());
 setContent(`
 <section class="welcome"><div><h2>Welcome to Ceylon Crust Pizza 🍕</h2><p>Manage your orders, invoices and sales in one place.</p></div><div class="welcome-mark">🍕</div></section>
 <section class="stats">
  <div class="stat" style="--accent:#d62828"><span class="label">Today's Orders</span><strong>${todayOrders.length}</strong><small>Invoices created today</small><span class="stat-ico">🧾</span></div>
  <div class="stat" style="--accent:#f4a623"><span class="label">Total Sales</span><strong>${money(totalSales)}</strong><small>All recorded invoices</small><span class="stat-ico">💰</span></div>
  <div class="stat" style="--accent:#238b57"><span class="label">Amount Paid</span><strong>${money(paid)}</strong><small>Payments received</small><span class="stat-ico">✅</span></div>
  <div class="stat" style="--accent:#3978c6"><span class="label">Pending Balance</span><strong>${money(due)}</strong><small>Outstanding amount</small><span class="stat-ico">⏳</span></div>
 </section>
 <div class="card"><div class="card-head"><h3>Recent Invoices</h3><button class="btn light small" onclick="navigateTo('invoices')">View all</button></div>${invoiceTable(invoices.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,5))}</div>
 `);
}
function invoiceTable(list){
 if(!list.length)return `<div class="empty">No invoices yet. Create your first invoice.</div>`;
 return `<div class="table-wrap"><table><thead><tr><th>Invoice No.</th><th>Customer</th><th>Invoice Date</th><th>Total</th><th>Balance</th><th>Status</th><th>Actions</th></tr></thead><tbody>
 ${list.map(x=>`<tr><td><b>${escapeHTML(x.id)}</b></td><td>${escapeHTML(x.customer)}</td><td>${escapeHTML(x.date)}</td><td>${money(x.total)}</td><td>${money(x.balance)}</td><td><span class="badge ${x.balance<=0?"paid":x.paid>0?"partial":"pending"}">${x.balance<=0?"PAID":x.paid>0?"PARTIAL":"PENDING"}</span></td><td><div class="actions"><button class="btn small blue" onclick="printInvoice('${x.id}')">Print</button><button class="btn small danger" onclick="deleteInvoice('${x.id}')">Delete</button></div></td></tr>`).join("")}
 </tbody></table></div>`;
}
function renderInvoices(){
 setContent(`<div class="card"><div class="card-head"><h3>All Invoices</h3><div class="actions"><input class="search" id="invoiceSearch" placeholder="Search invoice or customer..." oninput="filterInvoices()"><button class="btn" onclick="navigateTo('create')">+ New Invoice</button></div></div><div id="invoiceTable">${invoiceTable(invoices.slice().sort((a,b)=>b.createdAt-a.createdAt))}</div></div>`);
}
function filterInvoices(){
 const q=document.getElementById("invoiceSearch").value.toLowerCase();
 const found=invoices.filter(x=>[x.id,x.customer,x.phone,x.email].join(" ").toLowerCase().includes(q));
 document.getElementById("invoiceTable").innerHTML=invoiceTable(found);
}
function nextInvoiceId(){
 let max=0;
 invoices.forEach(x=>{const m=String(x.id).match(/^CCP-(\d+)$/);if(m)max=Math.max(max,Number(m[1]));});
 return "CCP-"+String(max+1).padStart(4,"0");
}
function renderCreate(){
 invoiceRows=[{name:menu[0]?.name||"",qty:1,price:Number(menu[0]?.price||0)}];
 setContent(`
 <div class="card"><div class="card-head"><h3>Create New Invoice</h3><span class="badge">AED Currency</span></div>
 <div class="form-grid">
  <div class="field"><label>Invoice Number</label><input id="invId" value="${nextInvoiceId()}" readonly></div>
  <div class="field"><label>Invoice Date</label><input id="invDate" type="date" value="${today()}"></div>
  <div class="field"><label>Order / Delivery Date</label><input id="orderDate" type="date" value="${today()}"></div>
  <div class="field"><label>Customer Type</label><select id="customerType"><option>Individual</option><option>Shop</option></select></div>
  <div class="field"><label>Customer Name *</label><input id="customerName" placeholder="Enter customer or shop name"></div>
  <div class="field"><label>Phone</label><input id="customerPhone" placeholder="Optional phone number"></div>
  <div class="field"><label>Email</label><input id="customerEmail" type="email" placeholder="Optional email"></div>
  <div class="field"><label>Payment Method</label><select id="paymentMethod"><option>Cash</option><option>Card</option><option>Bank Transfer</option><option>Online</option><option>Unpaid</option></select></div>
 </div></div>
 <div class="card"><div class="card-head"><h3>Pizza Items</h3><button class="btn orange small" onclick="addInvoiceRow()">+ Add Pizza</button></div><div id="invoiceRows"></div>
 <div class="summary"><div class="summary-row"><span>Subtotal</span><b id="subtotalText">AED 0.00</b></div><div class="summary-row"><label for="discount">Discount (AED)</label><input id="discount" type="number" min="0" value="0" style="width:100px;padding:5px" oninput="updateTotals()"></div><div class="summary-row total"><span>Grand Total</span><b id="grandTotalText">AED 0.00</b></div></div></div>
 <div class="card"><div class="form-grid">
  <div class="field"><label>Amount Paid (AED)</label><input id="amountPaid" type="number" min="0" value="0" oninput="updateTotals()"></div>
  <div class="field"><label>Notes</label><input id="invoiceNotes" placeholder="Optional notes"></div>
 </div><div class="summary" style="margin-top:16px"><div class="summary-row"><span>Balance Due</span><b id="balanceText">AED 0.00</b></div></div>
 <div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn gray" onclick="navigateTo('invoices')">Cancel</button><button class="btn green" onclick="saveInvoice()">Save Invoice</button></div></div>
 `);
 renderInvoiceRows();updateTotals();
}
function addInvoiceRow(){
 invoiceRows.push({name:menu[0]?.name||"",qty:1,price:Number(menu[0]?.price||0)});
 renderInvoiceRows();
}
function renderInvoiceRows(){
 const box=document.getElementById("invoiceRows");if(!box)return;
 box.innerHTML=invoiceRows.map((r,i)=>`<div class="invoice-line">
 <div class="field line-product"><label>Pizza Flavour</label><select onchange="changePizza(${i},this.value)">${menu.map(m=>`<option value="${escapeHTML(m.name)}" ${m.name===r.name?"selected":""}>${escapeHTML(m.name)}</option>`).join("")}</select></div>
 <div class="field"><label>Quantity</label><input type="number" min="1" value="${r.qty}" onchange="changeQty(${i},this.value)"></div>
 <div class="field"><label>Unit Price</label><input type="number" min="0" step=".01" value="${r.price}" onchange="changePrice(${i},this.value)"></div>
 <div class="field"><label>Line Total</label><input value="${money(r.qty*r.price)}" readonly></div>
 <button class="btn danger small" style="margin-bottom:1px" onclick="removeInvoiceRow(${i})">×</button>
 </div>`).join("");
}
function changePizza(i,name){const p=menu.find(m=>m.name===name);invoiceRows[i].name=name;invoiceRows[i].price=Number(p?.price||0);renderInvoiceRows();updateTotals()}
function changeQty(i,v){invoiceRows[i].qty=Math.max(1,Number(v)||1);renderInvoiceRows();updateTotals()}
function changePrice(i,v){invoiceRows[i].price=Math.max(0,Number(v)||0);renderInvoiceRows();updateTotals()}
function removeInvoiceRow(i){if(invoiceRows.length===1)return toast("At least one pizza item is required");invoiceRows.splice(i,1);renderInvoiceRows();updateTotals()}
function calculate(){
 const subtotal=invoiceRows.reduce((s,r)=>s+r.qty*r.price,0);
 const discount=Math.max(0,Number(document.getElementById("discount")?.value)||0);
 const total=Math.max(0,subtotal-discount);
 const paid=Math.max(0,Number(document.getElementById("amountPaid")?.value)||0);
 return {subtotal,discount,total,paid,balance:Math.max(0,total-paid)};
}
function updateTotals(){
 const t=calculate();
 const a=document.getElementById("subtotalText"),b=document.getElementById("grandTotalText"),c=document.getElementById("balanceText");
 if(a)a.textContent=money(t.subtotal);if(b)b.textContent=money(t.total);if(c)c.textContent=money(t.balance);
}
function saveInvoice(){
 const customer=document.getElementById("customerName").value.trim();
 if(!customer)return toast("Please enter the customer name");
 if(!invoiceRows.length)return toast("Add at least one pizza item");
 const t=calculate();
 if(t.paid>t.total)return toast("Amount paid cannot be more than the grand total");
 const inv={
  id:document.getElementById("invId").value,
  date:document.getElementById("invDate").value,
  orderDate:document.getElementById("orderDate").value,
  customer,type:document.getElementById("customerType").value,
  phone:document.getElementById("customerPhone").value.trim(),
  email:document.getElementById("customerEmail").value.trim(),
  method:document.getElementById("paymentMethod").value,
  notes:document.getElementById("invoiceNotes").value.trim(),
  rows:invoiceRows.map(r=>({...r})),...t,createdAt:Date.now()
 };
 invoices.push(inv);saveAll();toast("Invoice saved successfully");navigateTo("invoices");
}
function deleteInvoice(id){
 const inv=invoices.find(x=>x.id===id);if(!inv)return;
 if(!confirm(`Delete invoice ${id} for ${inv.customer}? This cannot be undone unless you have a backup.`))return;
 invoices=invoices.filter(x=>x.id!==id);saveAll();toast("Invoice deleted");navigateTo(currentPage);
}
function printInvoice(id){
 const x=invoices.find(v=>v.id===id);if(!x)return;
 const logo=settings.logo||"logo.png";
 const rows=x.rows.map(r=>`<tr><td>${escapeHTML(r.name)}</td><td>${r.qty}</td><td>${money(r.price)}</td><td>${money(r.qty*r.price)}</td></tr>`).join("");
 document.getElementById("printArea").innerHTML=`
 <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #d62828;padding-bottom:15px;margin-bottom:20px">
  <div style="display:flex;align-items:center;gap:15px"><img src="${logo}" style="width:95px;height:95px;object-fit:contain" onerror="this.style.display='none'"><div><h1 style="margin:0;color:#d62828;font-size:26px">CEYLON CRUST PIZZA</h1><p style="margin:5px 0;color:#777">Taste the Difference</p></div></div>
  <div style="text-align:right"><h2 style="margin:0">INVOICE</h2><b>${escapeHTML(x.id)}</b><p>Invoice date: ${escapeHTML(x.date)}</p><p>Order date: ${escapeHTML(x.orderDate)}</p></div>
 </div>
 <div style="margin:20px 0"><b>Bill To:</b><h3 style="margin:5px 0">${escapeHTML(x.customer)}</h3><p>${escapeHTML(x.type)}${x.phone?" | "+escapeHTML(x.phone):""}</p>${x.email?`<p>${escapeHTML(x.email)}</p>`:""}</div>
 <table style="width:100%;border-collapse:collapse"><thead><tr style="background:#fff0e9"><th style="text-align:left;padding:12px">Pizza</th><th style="padding:12px">Qty</th><th style="padding:12px">Unit Price</th><th style="padding:12px">Amount</th></tr></thead><tbody>${rows}</tbody></table>
 <div style="width:320px;margin:25px 0 0 auto"><p style="display:flex;justify-content:space-between"><span>Subtotal</span><b>${money(x.subtotal)}</b></p><p style="display:flex;justify-content:space-between"><span>Discount</span><b>${money(x.discount)}</b></p><h2 style="display:flex;justify-content:space-between;color:#d62828;border-top:2px solid #ddd;padding-top:12px"><span>Total</span><span>${money(x.total)}</span></h2><p style="display:flex;justify-content:space-between"><span>Amount paid</span><b>${money(x.paid)}</b></p><p style="display:flex;justify-content:space-between"><span>Balance due</span><b>${money(x.balance)}</b></p><p><b>Payment method:</b> ${escapeHTML(x.method)}</p></div>
 ${x.notes?`<p style="margin-top:25px"><b>Notes:</b> ${escapeHTML(x.notes)}</p>`:""}
 <p style="text-align:center;margin-top:55px;color:#777">Thank you for choosing Ceylon Crust Pizza!</p>`;
 const previousTitle=document.title;
 const safeCustomer=(x.customer||"Customer").normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9 _-]/g,"").trim().replace(/\s+/g,"_").slice(0,50)||"Customer";
 document.title=`${x.id}_${safeCustomer}`;
 const restorePrintState=()=>{document.title=previousTitle;window.removeEventListener("afterprint",restorePrintState)};
 window.addEventListener("afterprint",restorePrintState);
 window.print();
 setTimeout(restorePrintState,2000);
}
function renderCustomers(){
 const map={};
 invoices.forEach(x=>{const key=x.customer.toLowerCase();if(!map[key])map[key]={name:x.customer,phone:x.phone,email:x.email,count:0,total:0};map[key].count++;map[key].total+=x.total});
 const rows=Object.values(map);
 setContent(`<div class="card"><div class="card-head"><h3>Customers</h3><span class="badge">${rows.length} customers</span></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Customer</th><th>Phone</th><th>Email</th><th>Invoices</th><th>Total Sales</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${escapeHTML(x.name)}</b></td><td>${escapeHTML(x.phone||"-")}</td><td>${escapeHTML(x.email||"-")}</td><td>${x.count}</td><td>${money(x.total)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Customers will appear here after invoices are created.</div>`}</div>`);
}
function renderMenu(){
 setContent(`<div class="card"><div class="card-head"><h3>Pizza & Pricing</h3><button class="btn orange" onclick="addMenuItem()">+ Add Pizza</button></div><div class="table-wrap"><table><thead><tr><th>Pizza Name</th><th>Price (AED)</th><th>Action</th></tr></thead><tbody>${menu.map((m,i)=>`<tr><td><input id="menuName${i}" value="${escapeHTML(m.name)}" style="padding:9px;border:1px solid #ddd;border-radius:8px"></td><td><input id="menuPrice${i}" type="number" min="0" step=".01" value="${m.price}" style="padding:9px;border:1px solid #ddd;border-radius:8px;width:120px"></td><td><button class="btn small green" onclick="saveMenuItem(${i})">Save</button> <button class="btn small danger" onclick="deleteMenuItem(${i})">Delete</button></td></tr>`).join("")}</tbody></table></div></div>`);
}
function addMenuItem(){
 const name=prompt("Enter pizza name");if(!name||!name.trim())return;
 const price=Number(prompt("Enter price in AED","30"));if(!Number.isFinite(price)||price<0)return toast("Invalid price");
 menu.push({name:name.trim(),price});saveAll();renderMenu();
}
function saveMenuItem(i){
 const name=document.getElementById("menuName"+i).value.trim(),price=Number(document.getElementById("menuPrice"+i).value);
 if(!name||!Number.isFinite(price)||price<0)return toast("Enter a valid name and price");
 menu[i]={name,price};saveAll();toast("Pizza updated");renderMenu();
}
function deleteMenuItem(i){
 if(!confirm("Delete this pizza from the menu?"))return;
 menu.splice(i,1);saveAll();renderMenu();
}
function renderReports(){
 const total=invoices.reduce((s,x)=>s+x.total,0),paid=invoices.reduce((s,x)=>s+x.paid,0),due=invoices.reduce((s,x)=>s+x.balance,0);
 setContent(`<div class="stats"><div class="stat" style="--accent:#d62828"><span class="label">Invoices</span><strong>${invoices.length}</strong></div><div class="stat" style="--accent:#f4a623"><span class="label">Sales</span><strong>${money(total)}</strong></div><div class="stat" style="--accent:#238b57"><span class="label">Paid</span><strong>${money(paid)}</strong></div><div class="stat" style="--accent:#3978c6"><span class="label">Outstanding</span><strong>${money(due)}</strong></div></div>
 <div class="card"><div class="card-head"><h3>Export Business Data</h3></div><p class="muted">Download a spreadsheet of your invoices or a complete JSON backup.</p><div class="actions"><button class="btn green" onclick="exportCSV()">Export Invoices CSV</button><button class="btn blue" onclick="backupJSON()">Download Backup</button><label class="btn gray" for="restoreFile">Restore Backup</label><input id="restoreFile" type="file" accept=".json,application/json" class="hidden" onchange="restoreJSON(event)"></div></div>`);
}
function exportCSV(){
 const header=["Invoice No","Invoice Date","Order Date","Customer","Type","Phone","Email","Subtotal","Discount","Total","Paid","Balance","Payment Method"];
 const lines=[header,...invoices.map(x=>[x.id,x.date,x.orderDate,x.customer,x.type,x.phone,x.email,x.subtotal,x.discount,x.total,x.paid,x.balance,x.method])];
 const csv=lines.map(row=>row.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
 downloadFile("\uFEFF"+csv,"Ceylon_Crust_Invoices.csv","text/csv;charset=utf-8");
}
function backupJSON(){
 downloadFile(JSON.stringify({invoices,menu,settings},null,2),"Ceylon_Crust_Backup.json","application/json");
}
function restoreJSON(event){
 const file=event.target.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data.invoices)||!Array.isArray(data.menu))throw new Error("Invalid backup");if(!confirm("Restore this backup? Current local data will be replaced."))return;invoices=data.invoices;menu=data.menu;settings=data.settings||{};saveAll();toast("Backup restored");navigateTo("dashboard")}catch(e){toast("Could not restore this backup")}};
 reader.readAsText(file);event.target.value="";
}
function downloadFile(content,name,type){
 const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function renderSettings(){
 setContent(`<div class="card"><div class="card-head"><h3>Business Settings</h3></div><div class="form-grid">
 <div class="field"><label>Business Name</label><input id="businessName" value="${escapeHTML(settings.businessName||"Ceylon Crust Pizza")}"></div>
 <div class="field"><label>Currency</label><input value="AED" disabled></div>
 <div class="field full"><label>Business Tagline</label><input id="tagline" value="${escapeHTML(settings.tagline||"Taste the Difference")}"></div>
 </div><div class="actions" style="margin-top:18px"><button class="btn green" onclick="saveSettings()">Save Settings</button></div></div>
 <div class="card"><h3>Data & Privacy</h3><p class="muted">Your invoices, pizza menu and settings are saved in Firebase Firestore and synchronised for signed-in staff. Export regular backups from Sales Reports.</p><button class="btn blue" onclick="backupJSON()">Download Backup</button></div>`);
}
function saveSettings(){
 settings.businessName=document.getElementById("businessName").value.trim();
 settings.tagline=document.getElementById("tagline").value.trim();saveAll();toast("Settings saved");
}
async function loadCloudData(){
  try {
    const snapshot=await getDoc(CLOUD_DOC);
    if(snapshot.exists()){
      const data=snapshot.data();
      invoices=Array.isArray(data.invoices)?data.invoices:[];
      menu=Array.isArray(data.menu)?data.menu:menu;
      settings=data.settings&&typeof data.settings==="object"?data.settings:{};
    } else {
      await setDoc(CLOUD_DOC,{invoices:[],menu,settings,updatedAt:Date.now()});
    }
    return true;
  } catch(error) {
    console.error("Firestore load failed:",error);
    toast("Could not load cloud data. Check Firestore rules and internet.");
    return false;
  }
}

function init(){
  document.getElementById("loginPassword").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
  document.getElementById("loginEmail").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
  onAuthStateChanged(auth,async user=>{
    if(user){
      const loaded=await loadCloudData();
      if(loaded) showApp();
    } else {
      document.getElementById("app").classList.add("hidden");
      document.getElementById("loginScreen").classList.remove("hidden");
    }
  });
}
Object.assign(window,{
  addInvoiceRow,addMenuItem,backupJSON,deleteInvoice,deleteMenuItem,exportCSV,
  filterInvoices,login,logout,navigateTo,printInvoice,removeInvoiceRow,
  saveInvoice,saveMenuItem,saveSettings,changePizza,changePrice,changeQty,
  restoreJSON,updateTotals
});
init();
